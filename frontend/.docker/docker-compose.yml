version: '3.8'

networks:
  tiny-rtc-network:
    driver: bridge

services:
  frontend-dev:
    build:
      context: ..
      dockerfile: .docker/Dockerfile.dev
    container_name: tiny-rtc-chat-dev
    ports:
      - "5173:5173"
    volumes:
      - ..:/app
      - /app/node_modules
      - /app/dist
    environment:
      - CHOKIDAR_USEPOLLING=true
      - WATCHPACK_POLLING=true
    networks:
      - tiny-rtc-network
    command: npm run dev -- --host

  frontend-prod:
    build:
      context: ..
      dockerfile: .docker/Dockerfile
    container_name: tiny-rtc-chat-prod
    ports:
      - "3000:80"
    environment:
      - NODE_ENV=production
    networks:
      - tiny-rtc-network