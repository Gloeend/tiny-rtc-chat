version: '3.8'

networks:
  tiny-rtc-network:
    driver: bridge

services:
  nginx-proxy:
    image: nginx:alpine
    container_name: tiny-rtc-proxy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ../ssl:/etc/nginx/ssl:ro
      - ./ssl/gloeend.space.crt:/etc/nginx/ssl/gloeend.space.crt:ro
      - ./ssl/gloeend.space.key:/etc/nginx/ssl/gloeend.space.key:ro
    networks:
      - tiny-rtc-network
    depends_on:
      - frontend-prod
      - backend-prod
    restart: unless-stopped

  frontend-prod:
    build:
      context: ../frontend
      dockerfile: .docker/Dockerfile
    container_name: tiny-rtc-frontend-prod
    expose:
      - "80"
    networks:
      - tiny-rtc-network
    restart: unless-stopped

  backend-prod:
    build:
      context: ../backend
      dockerfile: .docker/Dockerfile
    container_name: tiny-rtc-backend-prod
    environment:
      - NODE_ENV=production
      - PORT=3001
      - CORS_ORIGIN=https://gloeend.space
      - SOCKET_ORIGIN=https://gloeend.space
      - DOMAIN=gloeend.space
    expose:
      - "3001"
    networks:
      - tiny-rtc-network
    restart: unless-stopped

  frontend-dev:
    build:
      context: ../frontend
      dockerfile: .docker/Dockerfile.dev
    container_name: tiny-rtc-frontend-dev
    ports:
      - "5173:5173"
    volumes:
      - ../frontend:/app
      - /app/node_modules
      - /app/dist
    environment:
      - CHOKIDAR_USEPOLLING=true
      - WATCHPACK_POLLING=true
      - VITE_API_URL=http://localhost:3001/api
      - VITE_WS_URL=ws://localhost:3001
    networks:
      - tiny-rtc-network
    command: npm run dev -- --host
    restart: unless-stopped

  backend-dev:
    build:
      context: ../backend
      dockerfile: .docker/Dockerfile.dev
    container_name: tiny-rtc-backend-dev
    ports:
      - "3001:3001"
    volumes:
      - ../backend:/app
      - /app/node_modules
    environment:
      - NODE_ENV=development
      - PORT=3001
      - CORS_ORIGIN=http://localhost:5173
      - SOCKET_ORIGIN=http://localhost:5173
    networks:
      - tiny-rtc-network
    restart: unless-stopped
