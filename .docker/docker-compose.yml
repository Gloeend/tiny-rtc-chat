version: '3.8'

networks:
  tiny-rtc-network:
    driver: bridge
    name: tiny-rtc-network

services:
  nginx-proxy:
    image: nginx:alpine
    container_name: tiny-rtc-proxy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./ssl:/etc/nginx/ssl:ro
    networks:
      - tiny-rtc-network
    restart: unless-stopped
    depends_on:
      - frontend-prod
      - backend-prod

  frontend-prod:
    build:
      context: ../frontend
      dockerfile: .docker/Dockerfile
    container_name: tiny-rtc-frontend
    expose:
      - "80"
    networks:
      - tiny-rtc-network
    environment:
      - NODE_ENV=production
    restart: unless-stopped

  backend-prod:
    build:
      context: ../backend
      dockerfile: .docker/Dockerfile
    container_name: tiny-rtc-backend
    expose:
      - "3001"
    networks:
      - tiny-rtc-network
    environment:
      - NODE_ENV=production
      - PORT=3001
      - CORS_ORIGIN=https://gloeend.space
      - SOCKET_ORIGIN=https://gloeend.space
      - DOMAIN=gloeend.space
    restart: unless-stopped

  frontend-dev:
    build:
      context: ../frontend
      dockerfile: .docker/Dockerfile.dev
    container_name: tiny-rtc-frontend-dev
    ports:
      - "5173:5173"
    volumes:
      - ../frontend:/app
      - /app/node_modules
    networks:
      - tiny-rtc-network
    environment:
      - VITE_API_URL=/api
      - VITE_WS_URL=wss://gloeend.space
    command: npm run dev -- --host
    restart: unless-stopped

  backend-dev:
    build:
      context: ../backend
      dockerfile: .docker/Dockerfile.dev
    container_name: tiny-rtc-backend-dev
    ports:
      - "3001:3001"
    volumes:
      - ../backend:/app
      - /app/node_modules
    networks:
      - tiny-rtc-network
    environment:
      - NODE_ENV=development
      - PORT=3001
      - CORS_ORIGIN=http://localhost:5173,http://gloeend.space
      - SOCKET_ORIGIN=http://localhost:5173,http://gloeend.space
    restart: unless-stopped